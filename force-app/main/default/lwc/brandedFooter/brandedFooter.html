<template>
    <!-- Zone 1: Main footer — background full width, content constrained and centred -->
    <footer class="branded-footer" role="contentinfo">
        <div class="branded-footer__container">

            <!-- Secondary navigation sections -->
            <div class="branded-footer__navigation">
                <template for:each={finalNavData} for:item="section">
                    <div key={section.sectionName} class={section.sectionClass}>
                        <div class="branded-footer__section">
                            <h2 class="branded-footer__heading">{section.sectionName}</h2>
                            <template if:true={section.twoColumnType}>
                                <ul class="branded-footer__list branded-footer__list--columns-2" aria-label="Navigation menu">
                                    <template for:each={section.relatedNavItems} for:item="item">
                                        <li key={item.navLinkName} class="branded-footer__list-item">
                                            <a href={item.navLinkURL} class="branded-footer__link">{item.navLinkName}</a>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={section.twoColumnType}>
                                <ul class="branded-footer__list" aria-label="Navigation menu">
                                    <template for:each={section.relatedNavItems} for:item="item">
                                        <li key={item.navLinkName} class="branded-footer__list-item">
                                            <a href={item.navLinkURL} class="branded-footer__link">{item.navLinkName}</a>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <hr class="branded-footer__section-break" />

            <!-- Meta links: always Privacy, Cookies, Accessibility Statement -->
            <div class="branded-footer__meta">
                <ul class="branded-footer__inline-list">
                    <li class="branded-footer__inline-list-item">
                        <a href={privacyUrl} class="branded-footer__meta-link">Privacy</a>
                    </li>
                    <li class="branded-footer__inline-list-item">
                        <a href={cookiesUrl} class="branded-footer__meta-link">Cookies</a>
                    </li>
                    <li class="branded-footer__inline-list-item">
                        <a href={accessibilityUrl} class="branded-footer__meta-link">Accessibility Statement</a>
                    </li>
                </ul>
            </div>

        </div>
    </footer>

    <!-- Zone 2: Licence bar — background full width, content constrained and centred -->
    <template if:false={hideLicenceBar}>
        <div class="branded-footer__licence-bar">
            <div class="branded-footer__container">
                <div class="branded-footer__licence-content">
                    <svg aria-hidden="true"
                         focusable="false"
                         class="branded-footer__licence-logo"
                         xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 483.2 195.7"
                         height="17"
                         width="41">
                        <path fill="currentColor" d="M421.5 142.8V.1l-50.7 32.3v161.1h112.4v-50.7zm-122.3-9.6A47.12 47.12 0 0 1 221 97.8c0-26 21.1-47.1 47.1-47.1 16.7 0 31.4 8.7 39.7 21.8l42.7-27.2A97.63 97.63 0 0 0 268.1 0c-36.5 0-68.3 20.1-85.1 49.7A98 98 0 0 0 97.8 0C43.9 0 0 43.9 0 97.8s43.9 97.8 97.8 97.8c36.5 0 68.3-20.1 85.1-49.7a97.76 97.76 0 0 0 149.6 25.4l19.4 22.2h3v-87.8h-80l24.3 27.5zM97.8 145c-26 0-47.1-21.1-47.1-47.1s21.1-47.1 47.1-47.1 47.2 21 47.2 47S123.8 145 97.8 145"></path>
                    </svg>
                    <span class="branded-footer__licence-text">
                        {licenceBarPrefix}<a href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
                           class="branded-footer__licence-link"
                           target="_blank"
                           rel="noopener noreferrer">Open Government Licence v3.0</a>{licenceBarSuffix}
                    </span>
                </div>
            </div>
        </div>
    </template>
</template>
